[project]
name = "confirmai"
version = "2.2.0"
description = "Invoice vs. order confirmation (AB) matcher: LLM extraction + deterministic tolerance rules"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not integration'"
markers = [
    "integration: needs a running Ollama with mistral + nomic-embed-text (run with: pytest -m integration)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]  # FastAPI's File()/Form() defaults are the framework idiom
